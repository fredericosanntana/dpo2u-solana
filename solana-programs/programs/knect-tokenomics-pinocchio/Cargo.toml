[package]
name = "knect-tokenomics-pinocchio"
version = "0.1.0"
description = "Kolibri KNECT tokenomics — atomic phased revenue split (WP v2.1 §04): Fase 1 50/25/0/25, Fase 2 25/25/25/25 (KBR cbBTC / Buyback→Reserva de Cashback no-burn / Pool Staking USDC / Fundo Kolibri). Pinocchio port for low-CU mainnet operation."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "knect_tokenomics_pinocchio"

[features]
no-entrypoint = []
# Defined so `anchor build` at the workspace level treats this Pinocchio
# crate as buildable. No Anchor IDL emitted.
idl-build = []

[dependencies]
pinocchio = "0.9"
pinocchio-system = "0.4"
pinocchio-pubkey = "0.3"
pinocchio-log = "0.4"
pinocchio-token = "0.6"
borsh = { version = "1.5", default-features = false, features = ["derive"] }
