[package]
name = "agent-registry"
version = "0.1.0"
description = "DPO2U Agent Registry — on-chain DID records for autonomous compliance agents."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_registry"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "legal-source-manifest/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
# Cross-program account type for verify_against_legal_manifest (added 2026-05-15)
legal-source-manifest = { path = "../legal-source-manifest", features = ["cpi"] }
