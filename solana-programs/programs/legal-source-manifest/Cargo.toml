[package]
name = "legal-source-manifest"
version = "0.1.0"
description = "DPO2U Legal Source Manifest — on-chain pointer + content_hash for jurisdictional legal corpus versions consumed from the legal-corpus worker."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "legal_source_manifest"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
borsh = "1.5.1"
